name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly full scan keeps code scanning results fresh even though the expensive
  # Swift leg is skipped on pull requests (see the analyze job's `if`).
  # workflow_dispatch allows an on-demand re-scan without pushing.
  schedule:
    - cron: "32 4 * * 1" # Mondays 04:32 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # The Swift leg is a ~15-minute traced build (actions/python are buildless
    # and take seconds). No required status check depends on it, so skip it on
    # pull requests; it still runs on push to main, the weekly schedule, and
    # manual dispatch. actions/python keep running on every push and pull request.
    if: ${{ matrix.language != 'swift' || github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      security-events: write # upload code scanning results
      packages: read # fetch internal/private CodeQL packs
      actions: read # required for the "actions" language on private repos
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-24.04
          - language: python
            build-mode: none
            runner: ubuntu-24.04
          - language: swift
            build-mode: manual
            runner: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        if: matrix.language == 'swift'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Swift can't use autobuild: the Xcode project stores its sources in Xcode
      # 16 synchronized folder groups (PBXFileSystemSynchronizedRootGroup), which
      # leave every target's "Sources" build phase empty. CodeQL's autobuild
      # inspects those phases to pick a target, finds no Swift there, and reports
      # "No Swift compilation target found". Building manually makes CodeQL trace
      # the real swiftc invocations instead, the same way the CI build job builds.
      #
      # ARCHS=arm64 builds a single architecture (the macos runner's native
      # simulator slice) instead of arm64 + x86_64. CodeQL traces swiftc and
      # extracts each compiled source file, so building both simulator arches
      # extracts every file twice into an identical database. One arch produces
      # the same analysis while roughly halving this (dominant) traced build.
      #
      # COMPILER_INDEX_STORE_ENABLE=NO skips Xcode's source-index generation, an
      # IDE-only artifact CodeQL doesn't consume, trimming the traced build.
      #
      # Note: don't cache DerivedData across runs to skip this build. CodeQL only
      # extracts files the traced build actually recompiles, so a warm/incremental
      # build would yield an empty or incomplete database.
      - name: Build Swift (manual)
        if: matrix.language == 'swift'
        run: |
          xcodebuild clean build \
            -project TradingUp.xcodeproj \
            -scheme TradingUp \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"
