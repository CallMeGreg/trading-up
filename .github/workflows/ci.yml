name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify harness
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Compile and run tools/verify/main.swift
        run: |
          swiftc TradingUp/Models/Card.swift TradingUp/Models/Economy.swift TradingUp/Models/FeatureFlags.swift TradingUp/Models/GameCore.swift TradingUp/Models/Persistence.swift TradingUp/Generated/CardData.swift tools/verify/main.swift -o /tmp/tu_verify
          /tmp/tu_verify

  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Build
        run: |
          xcodebuild build \
            -project TradingUp.xcodeproj \
            -scheme TradingUp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  test:
    name: Unit tests (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Pick an available iOS Simulator
        id: sim
        run: |
          set -euo pipefail
          name=$(xcrun simctl list devices available iOS -j | /usr/bin/python3 .github/scripts/pick_simulator.py)
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          xcodebuild test \
            -project TradingUp.xcodeproj \
            -scheme TradingUp \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO
